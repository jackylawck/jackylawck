name: 'Dependency Review (Financial Grade)'

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 採用精準的 PR 創建者語意判定；非 Dependabot 才在 PR 留言，避開 403 權限陷阱
          comment-summary-in-pr: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
          fail-on-severity: moderate
          deny-licenses: GPL-1.0-or-later, LGPL-2.0-or-later
          retry-on-snapshot-warnings: true
          sbom-format: spdx

      - name: Upload SBOM as Artifact (Audit Trail)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-dependency-list-${{ github.event.pull_request.head.sha }}
          path: dependency-review-sbom.spdx
          if-no-files-found: ignore
          retention-days: 90
