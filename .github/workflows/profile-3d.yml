name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Theme
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # ==========================================
          # 1. 提交數字：精準注入 NERV 警戒紅 (#FF1E27)
          # ==========================================
          pos = svg.lower().find("contributions")
          if pos != -1:
              start_pos = max(0, pos - 300)
              prefix = svg[start_pos:pos]
              pattern = r'(<(?:text|tspan)[^>]*>)(\s*\d+\s*)(</(?:text|tspan)>)'
              matches = list(re.finditer(pattern, prefix, flags=re.IGNORECASE))
              if matches:
                  last_m = matches[-1]
                  tag_open = last_m.group(1)
                  num = last_m.group(2)
                  tag_close = last_m.group(3)
                  if 'fill=' in tag_open:
                      tag_open = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#FF1E27"', tag_open)
                  else:
                      tag_open = tag_open[:-1] + ' fill="#FF1E27" font-weight="bold">'
                  new_tag = f"{tag_open}{num}{tag_close}"
                  prefix = prefix[:last_m.start()] + new_tag + prefix[last_m.end():]
                  svg = svg[:start_pos] + prefix + svg[pos:]

          # ==========================================
          # 2. 語言圓形圖：EVA 全機體代表色矩陣
          # ==========================================
          pie_colors = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_colors.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # ==========================================
          # 3. 核心 3D 柱體：嚴格「AND」雙通道過濾
          # ==========================================
          def process_3d_color(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒純黑
              if l < 0.16 and s < 0.25: return "#000000"
              # B. 跑道地盤與底座格線 -> 螢光綠導引軌道
              if 0.16 <= l < 0.40 and s < 0.28: return "#15441E"
              if 0.40 <= l < 0.55 and s < 0.28: return "#39FF14"
              # C. 標籤文字 -> 使徒純白
              if s < 0.15 and l >= 0.55: return "#FFFFFF"

              # D. 3D 柱體光影分流
              if (g_val > r_val) and (g_val > b_val) and s > 0.15:
                  if (g_val >= 190 and r_val >= 80) or l >= 0.56:
                      if l >= 0.50:
                          return "#39FF14"  # 頂面：EV-04 暴走蓄光螢光綠
                      elif l >= 0.35:
                          return "#28C70E"  # 受光側面：螢光綠中調
                      else:
                          return "#1A8A08"  # 背光側面：螢光綠暗面
                  else:
                      if l >= 0.30:
                          return "#7B2CBF"  # 裝甲受光亮紫
                      elif l >= 0.20:
                          return "#5A189A"  # 裝甲中調紫
                      else:
                          return "#3C096C"  # 裝甲背光暗紫

              return None

          protected = [
              "#FF1E27", "#39FF14", "#00FF66", "#FFFFFF", "#000000",
              "#15441E", "#F29600", "#19325C", "#D9001B", "#E85298", "#8A3FFC",
              "#28C70E", "#1A8A08", "#7B2CBF", "#5A189A", "#3C096C"
          ]

          def hex_cleaner(m):
              c = m.group(0)
              if c.upper() in protected: return c
              r, g, b = int(c[1:3], 16), int(c[3:5], 16), int(c[5:7], 16)
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else c

          def rgb_cleaner(m):
              r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else m.group(0)

          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_cleaner, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_cleaner, svg)

          # ==========================================
          # 4. 右上角雷達圖：坐標錨點精準打擊 (絕對鎖定螢光綠)
          # ==========================================
          for kw in ["PullReq", "Commit", "Issue"]:
              kw_pos = svg.find(kw)
              if kw_pos != -1:
                  start_radar = max(0, kw_pos - 2500)
                  end_radar = min(len(svg), kw_pos + 2500)
                  radar_part = svg[start_radar:end_radar]

                  def replace_radar_fill(tag_match):
                      t = tag_match.group(0)
                      # 排除背景五角形格線
                      if 'fill="none"' in t or "fill:none" in t or "fill='none'" in t:
                          return t
                      
                      # 強制換色（處理標準屬性與內聯樣式）
                      t = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#39FF14"', t)
                      t = re.sub(r'stroke=["\'][^"\']+["\']', 'stroke="#00FF66"', t)
                      t = re.sub(r'fill:\s*[^;"]+', 'fill:#39FF14', t)
                      t = re.sub(r'stroke:\s*[^;"]+', 'stroke:#00FF66', t)

                      # 【關鍵防護】確保雷達圖是半透明的，不會變成實心綠塊擋住文字
                      if 'fill-opacity' not in t and 'opacity' not in t:
                          t = t[:-1] + ' fill-opacity="0.45">'
                      return t

                  new_radar = re.sub(r'<(?:polygon|path)[^>]+>', replace_radar_fill, radar_part)
                  svg = svg[:start_radar] + new_radar + svg[end_radar:]
                  break

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully rendered EVA-01 Masterpiece with absolute Radar green lock!")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: anchor-based lock for radar neon green with opacity protection [skip ci]"
          git pull --rebase
          git push