name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Theme
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # ==========================================
          # 1. 提交總數換為 NERV 超機密警戒紅 (#FF1E27)
          # ==========================================
          # 替換 text 標籤本體屬性與內容，通殺原有黃色
          def make_count_red(m):
              full = m.group(0)
              full = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#FF1E27"', full)
              return full

          svg = re.sub(r'<text[^>]*>\s*<tspan[^>]*>\s*\d+\s*</tspan>[^<]*contributions[^<]*</text>', make_count_red, svg, flags=re.IGNORECASE)
          svg = re.sub(r'<text[^>]*>\s*\d+\s+contributions\s*</text>', make_count_red, svg, flags=re.IGNORECASE)

          # 若仍有殘留的黃色提交數字標籤，強制將 contributions 前的文字填色改為警戒紅
          svg = re.sub(
              r'(fill=["\'])#[0-9a-fA-F]{6}(["\'][^>]*>\s*\d+)',
              r'\g<1>#FF1E27\g<2>',
              svg,
              count=1
          )

          # ==========================================
          # 2. 右上角雷達圖：全面切換為暴走螢光綠
          # ==========================================
          def fix_radar_polygon(m):
              tag = m.group(0)
              tag = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#39FF14"', tag)
              tag = re.sub(r'stroke=["\'][^"\']+["\']', 'stroke="#00FF66"', tag)
              tag = re.sub(r'fill-opacity=["\'][^"\']+["\']', 'fill-opacity="0.38"', tag)
              return tag

          svg = re.sub(r'<(polygon|path)[^>]+fill-opacity[^>]+>', fix_radar_polygon, svg, flags=re.IGNORECASE)

          # ==========================================
          # 3. 語言圓形圖：EVA 全機體代表色矩陣
          # ==========================================
          pie_colors = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_colors.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # ==========================================
          # 4. 3D 柱狀圖：高峰 360 度全綠，其餘 360 度全紫
          # ==========================================
          protected = [c.upper() for c in pie_colors.values()] + ["#FF1E27", "#39FF14", "#00FF66", "#FFFFFF"]

          def process_rgb_tuple(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒純黑 (#000000)
              if l < 0.16 and s < 0.25:
                  return "#000000"

              # B. 跑道地盤與底座格線 -> 螢光綠發光導引軌道
              if 0.16 <= l < 0.40 and s < 0.28:
                  return "#15441E"  # 發光綠底板
              if 0.40 <= l < 0.55 and s < 0.28:
                  return "#39FF14"  # 銳利螢光綠格線

              # C. 標籤文字 (Commit, Issue, Repo 等) -> 使徒純白
              if s < 0.15 and l >= 0.55:
                  return "#FFFFFF"

              # D. 柱體處理：
              # 在原版 night-green 中，最高峰天數柱體整組的特徵是：g_val > 140 且 g_val 比 r/b 高很多
              if 0.18 <= h <= 0.48 and s > 0.15:
                  # 【最高峰柱（360度整根全為暴走螢光綠）】
                  # 判定條件：只要是最高等級柱體（受光側面、頂面與陰影側面）
                  if g_val >= 148:
                      if l >= 0.50:
                          return "#39FF14"  # 頂面：EV-04 純粹暴走螢光綠
                      elif l >= 0.38:
                          return "#28C70E"  # 左受光面：螢光綠中調
                      else:
                          return "#1A8A08"  # 右背光面：螢光綠深調陰影
                  
                  # 【中低矮柱（360度整根全為夜戰暗紫裝甲）】
                  else:
                      purple_h = 0.768  # Gaia 官方初號機紫
                      # 保留原有的光影比例，但整體色調轉為飽和深紫裝甲
                      adj_l = min(0.68, max(0.24, l * 0.90))
                      adj_s = min(1.0, max(0.75, s * 1.5))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return None

          def hex_replacer(m):
              c = m.group(0)
              if c.upper() in protected:
                  return c
              r = int(c[1:3], 16)
              g = int(c[3:5], 16)
              b = int(c[5:7], 16)
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else c

          def rgb_replacer(m):
              r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else m.group(0)

          # 全量無損替換
          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_replacer, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_replacer, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully rendered Eva-01 with All-Green Peaks & NERV Red Count!")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: apply Evangelion 360-degree green peaks and red count [skip ci]"
          git pull --rebase
          git push
