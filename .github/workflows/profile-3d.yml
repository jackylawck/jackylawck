name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Evangelion Unit-01 Theme
        run: |
          SRC="profile-3d-contrib/profile-night-green.svg"
          DEST="profile-3d-contrib/profile-eva-01.svg"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST"

            # 1. 拘束器黑與深暗紫底座
            sed -i 's/#222222/#0D0714/gI' "$DEST"
            sed -i 's/#2d333b/#180928/gI' "$DEST"
            sed -i 's/#1c2128/#0D0714/gI' "$DEST"
            sed -i 's/#161b22/#10071A/gI' "$DEST"

            # 2. 坐標軸與輔助網格：初號機紫
            sed -i 's/#444c56/#38175E/gI' "$DEST"
            sed -i 's/#768390/#5E239D/gI' "$DEST"

            # 3. 柱體主體色：大面積收攏為初號機暗紫裝甲（低至高階提交全數轉紫）
            sed -i 's/#0e4429/#280C44/gI' "$DEST"
            sed -i 's/#006d32/#3E1668/gI' "$DEST"
            sed -i 's/#196127/#4D1980/gI' "$DEST"
            sed -i 's/#238636/#5D1E99/gI' "$DEST"
            sed -i 's/#26a641/#7324BD/gI' "$DEST"
            sed -i 's/#2e6f40/#4D1980/gI' "$DEST"
            sed -i 's/#316d39/#5D1E99/gI' "$DEST"
            sed -i 's/#3fb950/#6D1FB5/gI' "$DEST"

            # 4. 點綴色：僅最高提交峰值與雷達圖線條保留暴走螢光綠
            sed -i 's/#39d353/#39FF14/gI' "$DEST"
            sed -i 's/#57ab5a/#00FF66/gI' "$DEST"

            echo "Successfully generated Eva-01 purple & green palette."
          fi

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update Eva-01 3D graph [skip ci]"
          git pull --rebase
          git push
