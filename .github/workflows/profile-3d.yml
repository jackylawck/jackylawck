name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply Neon Genesis Evangelion Aesthetic (Black & White Typo + Unit-01 Colors)
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # 1. 圓形圖：EVA 全機體官方配色對映
          pie_replacements = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲烈焰紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#7B42BC",  # 初號機 高光紫
              "#89e051": "#39FF14",  # 初號機 暴走螢光綠 (EV-04)
          }
          for old_c, new_c in pie_replacements.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # 2. 核心顏色轉換函數（支援 Hex 及 RGB 格式）
          protected_colors = [c.upper() for c in pie_replacements.values()]

          def process_rgb_tuple(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景與深色面板 -> 使徒襲來「極黑底座」
              if l < 0.28 and s < 0.25:
                  return "#000000"

              # B. 坐標格線與文字（原本偏灰白或暗綠）-> 使徒襲來「銳利純白」或冷紫格線
              if s < 0.18:
                  if l >= 0.45:
                      return "#FFFFFF"  # 純白字
                  elif l >= 0.2:
                      return "#2A1838"  # 暗紫格線

              # C. 綠色調元素（包含 3D 柱體的所有受光面、側面陰影與頂面）
              if 0.18 <= h <= 0.48 and s > 0.15:
                  # 僅在頂部最高峰面保留 EV-04 螢光綠
                  if l >= 0.75 or (g > 0.90 and r < 0.35):
                      return "#39FF14"
                  # 其餘 85% 柱體本體 -> Gaia EV-03 初號機夜戰暗紫
                  else:
                      purple_h = 0.765  # 初號機紫色相
                      adj_l = min(0.55, max(0.18, l * 0.72))
                      adj_s = min(1.0, max(0.70, s * 1.4))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return None

          def hex_replacer(match):
              hex_code = match.group(0)
              if hex_code.upper() in protected_colors:
                  return hex_code
              r = int(hex_code[1:3], 16)
              g = int(hex_code[3:5], 16)
              b = int(hex_code[5:7], 16)
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else hex_code

          def rgb_replacer(match):
              r = int(match.group(1))
              g = int(match.group(2))
              b = int(match.group(3))
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else match.group(0)

          # 執行轉換：替換 hex 與 rgb
          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_replacer, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_replacer, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully injected Neon Genesis Evangelion Typography & Armor Palette.")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: apply Evangelion black-white typo and Eva-01 palette [skip ci]"
          git pull --rebase
          git push
