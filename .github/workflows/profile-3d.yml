name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Theme (Optimized Robust Engine)
        run: |
          python3 - << 'EOF'
          import colorsys
          import os
          import re
          import sys

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          if not os.path.exists(src_path):
              print(f"Error: Source file '{src_path}' not found.", file=sys.stderr)
              sys.exit(1)

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # ==========================================
          # 1. 提交數字：以標籤邊界安全注入 NERV 警戒紅 (#FF1E27)
          # ==========================================
          def format_contributions_text(match):
              block = match.group(0)
              def style_number(tspan_match):
                  open_tag, num, close_tag = tspan_match.groups()
                  if 'fill=' in open_tag:
                      open_tag = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#FF1E27"', open_tag)
                  else:
                      open_tag = open_tag[:-1] + ' fill="#FF1E27" font-weight="bold">'
                  return f"{open_tag}{num}{close_tag}"

              # 優先匹配內嵌的 tspan 數字節點，若無則匹配純文字數值
              if '<tspan' in block:
                  return re.sub(r'(<tspan\b[^>]*>)(\s*\d+\s*)(</tspan>)', style_number, block, count=1)
              return re.sub(r'(>\s*)(\d+)(\s*contributions)', r'\1<tspan fill="#FF1E27" font-weight="bold">\2</tspan>\3', block, count=1)

          # 嚴格限制在包含 contributions 的 <text> 標籤邊界內，杜絕任意字串切片
          svg = re.sub(
              r'<text\b[^>]*>(?:(?!</text>)[\s\S])*?contributions(?:(?!</text>)[\s\S])*?</text>',
              format_contributions_text,
              svg,
              count=1,
              flags=re.IGNORECASE
          )

          # ==========================================
          # 2. 語言圓形圖：EVA 全機體代表色矩陣
          # ==========================================
          pie_colors = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_colors.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # ==========================================
          # 3. 核心 3D 柱體與底座：HLS 運算＋記憶體快取加速
          # ==========================================
          color_cache = {}

          def process_3d_color(r_val, g_val, b_val):
              key = (r_val, g_val, b_val)
              if key in color_cache:
                  return color_cache[key]

              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒純黑
              if l < 0.16 and s < 0.25:
                  result = "#000000"
              # B. 跑道地盤與底座格線 -> 螢光綠導引軌道
              elif 0.16 <= l < 0.40 and s < 0.28:
                  result = "#15441E"
              elif 0.40 <= l < 0.55 and s < 0.28:
                  result = "#39FF14"
              # C. 標籤文字 -> 使徒純白
              elif s < 0.15 and l >= 0.55:
                  result = "#FFFFFF"
              # D. 3D 柱體分色（所有綠色系面）
              elif (g_val > r_val) and (g_val > b_val) and s > 0.15:
                  # 中高活躍頂面：暴走螢光青綠頂部
                  if (g_val >= 135 and l >= 0.46) or (r_val >= 70 and l >= 0.44):
                      result = "#39FF14"
                  # 柱身側面與中低矮柱：初號機夜戰深紫裝甲
                  else:
                      if l >= 0.30:
                          result = "#7B2CBF"
                      elif l >= 0.20:
                          result = "#5A189A"
                      else:
                          result = "#3C096C"
              else:
                  result = None

              color_cache[key] = result
              return result

          protected = {
              c.upper() for c in list(pie_colors.values()) + [
                  "#FF1E27", "#39FF14", "#00FF66", "#FFFFFF", "#000000",
                  "#15441E", "#28C70E", "#1A8A08", "#7B2CBF", "#5A189A", "#3C096C"
              ]
          }

          def hex_cleaner(m):
              c = m.group(0)
              if c.upper() in protected:
                  return c
              r, g, b = int(c[1:3], 16), int(c[3:5], 16), int(c[5:7], 16)
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else c

          def rgb_cleaner(m):
              r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else m.group(0)

          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_cleaner, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_cleaner, svg)

          # ==========================================
          # 4. 右上角能力雷達圖：針對實心多邊形精準鎖定
          # ==========================================
          def replace_radar_polygon(match):
              tag = match.group(0)
              # 排除背景五角形格線 (fill="none" 或 fill:none)
              if 'fill="none"' in tag or "fill:none" in tag or "fill='none'" in tag:
                  return tag
              # 強制換為 EV-04 暴走螢光綠面與發光線條
              tag = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#39FF14"', tag)
              tag = re.sub(r'stroke=["\'][^"\']+["\']', 'stroke="#00FF66"', tag)
              tag = re.sub(r'fill:\s*[^;"]+', 'fill:#39FF14', tag)
              tag = re.sub(r'stroke:\s*[^;"]+', 'stroke:#00FF66', tag)
              if 'fill-opacity' not in tag and 'opacity' not in tag:
                  tag = tag[:-1] + ' fill-opacity="0.45">'
              return tag

          # 雷達圖資料面是 SVG 中唯一具備填充的 <polygon> 標籤
          svg = re.sub(r'<polygon\b[^>]+>', replace_radar_polygon, svg, flags=re.IGNORECASE)

          # ==========================================
          # 5. 輸出前結構完整性檢查
          # ==========================================
          if not svg.strip().endswith("</svg>"):
              print("Warning: Generated SVG does not properly close with </svg>", file=sys.stderr)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully rendered EVA-01 Masterpiece with optimized, robust engine!")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: optimize EVA-01 workflow with robust tag-bounded engine [skip ci]"
          git pull --rebase
          git push
