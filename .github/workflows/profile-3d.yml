name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply Official Gaia/Mr.Hobby Eva-01 Palette
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          def apply_eva_colors(match):
              h_str = match.group(0)
              r = int(h_str[1:3], 16) / 255.0
              g = int(h_str[3:5], 16) / 255.0
              b = int(h_str[5:7], 16) / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # 1. 拘束架底色與背景（深邃黑紫）
              if l < 0.15 and s < 0.25:
                  return "#0E0817"
              if 0.15 <= l < 0.35 and s < 0.25:
                  return "#1A0E2A"

              # 2. 綠色調元素（所有 3D 柱體與網格）
              if 0.19 <= h <= 0.46 and s > 0.2:
                  # 最高峰頂部與突破線 -> 塗料 EV-04 / HEV102 螢光綠點綴
                  if l >= 0.58 or (g > 0.85 and r < 0.6 and b < 0.6):
                      return "#39FF14"
                  # 柱體主軀幹與側面光影 -> 塗料 EV-03 / HEV101 夜戰暗紫裝甲
                  else:
                      # 依照原圖明暗比例計算暗紫裝甲階梯
                      purple_h = 0.765  # 官方紫基準色相
                      adj_l = min(0.60, max(0.18, l * 0.92))
                      adj_s = min(1.0, max(0.60, s * 1.25))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return h_str

          converted_svg = re.sub(r'#[0-9a-fA-F]{6}', apply_eva_colors, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(converted_svg)

          print("Successfully rendered Eva-01 Official Gaia/Mr.Hobby Palette.")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update Eva-01 official palette 3D graph [skip ci]"
          git pull --rebase
          git push
