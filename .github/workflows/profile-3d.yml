name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Theme
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # ==========================================
          # 1. 覆寫 <style> 樣式表，擊破 CSS 顏色覆蓋問題
          # ==========================================
          # 注入專屬 EVA 樣式：數字強制警戒紅、文字使徒純白
          eva_css_override = """
          <style>
            text { fill: #FFFFFF !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important; }
            .total, .strong, .chart-label { fill: #FF1E27 !important; font-weight: bold !important; }
            .contributions-number { fill: #FF1E27 !important; font-weight: 800 !important; }
          </style>
          """
          svg = svg.replace("</svg>", f"{eva_css_override}</svg>")

          # 暴力正則直接置換 contributions 前方的數字為 NERV 警戒紅
          svg = re.sub(
              r'(\d+)(\s*contributions)',
              r'<tspan fill="#FF1E27" font-weight="bold">\1</tspan><tspan fill="#FFFFFF">\2</tspan>',
              svg,
              count=1
          )

          # ==========================================
          # 2. 右上角能力雷達圖：全面切換為暴走螢光綠
          # ==========================================
          def fix_radar_polygon(m):
              tag = m.group(0)
              tag = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#39FF14"', tag)
              tag = re.sub(r'stroke=["\'][^"\']+["\']', 'stroke="#00FF66"', tag)
              tag = re.sub(r'fill-opacity=["\'][^"\']+["\']', 'fill-opacity="0.38"', tag)
              return tag

          svg = re.sub(r'<(polygon|path)[^>]+fill-opacity[^>]+>', fix_radar_polygon, svg, flags=re.IGNORECASE)

          # ==========================================
          # 3. 核心 3D 柱體與底盤轉換
          # ==========================================
          def process_3d_color(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒純黑 (#000000)
              if l < 0.16 and s < 0.25:
                  return "#000000"

              # B. 跑道地盤與底座格線 -> 螢光綠發光導引軌道
              if 0.16 <= l < 0.40 and s < 0.28:
                  return "#15441E"
              if 0.40 <= l < 0.55 and s < 0.28:
                  return "#39FF14"

              # C. 標籤文字 -> 使徒純白
              if s < 0.15 and l >= 0.55:
                  return "#FFFFFF"

              # D. 3D 柱體處理：
              # 只要是綠色系（G 明顯大於 R 與 B）
              if (g_val > r_val * 1.15) and (g_val > b_val * 1.15) and s > 0.15:
                  # 【判定最高峰柱（360度整根全為螢光綠）】
                  # 將門檻放寬至 G >= 95 且亮度 >= 0.30，完整覆蓋受光面與最深背光面
                  if g_val >= 95 and l >= 0.28:
                      if l >= 0.50:
                          return "#39FF14"  # 頂面：暴走蓄光螢光綠
                      elif l >= 0.36:
                          return "#28C70E"  # 受光側面：螢光綠中調
                      else:
                          return "#1A8A08"  # 背光側面：螢光綠暗面
                  
                  # 【其餘中低矮柱（360度整根全為 Gaia EV-03 夜戰深紫）】
                  else:
                      purple_h = 0.768  # 初號機紫
                      adj_l = min(0.68, max(0.24, l * 0.90))
                      adj_s = min(1.0, max(0.75, s * 1.5))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return None

          def hex_replacer(m):
              c = m.group(0)
              protected = ["#FF1E27", "#39FF14", "#00FF66", "#FFFFFF", "#000000", "#15441E"]
              if c.upper() in protected:
                  return c
              r = int(c[1:3], 16)
              g = int(c[3:5], 16)
              b = int(c[5:7], 16)
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else c

          def rgb_replacer(m):
              r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else m.group(0)

          # 全量無損替換
          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_replacer, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_replacer, svg)

          # ==========================================
          # 4. 語言圓形圖：EVA 全機體代表色矩陣 (強制覆蓋)
          # ==========================================
          pie_colors = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_colors.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully rendered Eva-01 Masterpiece with CSS overrides and 360-degree green pillars!")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: apply CSS overrides and 360-degree green pillars [skip ci]"
          git pull --rebase
          git push
