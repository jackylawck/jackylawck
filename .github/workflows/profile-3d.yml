name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Theme
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # 1. 提交數字改為 NERV 警戒紅 (#FF1E27)，後方文字保持白色
          svg = re.sub(
              r'(\b\d+\b)(\s+contributions)',
              r'<tspan fill="#FF1E27" font-weight="bold">\1</tspan><tspan fill="#FFFFFF">\2</tspan>',
              svg,
              count=1
          )

          # 2. 右上角雷達圖：安全鎖定包含 fill-opacity 的多邊形/路徑，賦予暴走螢光綠
          def fix_radar_tag(m):
              tag = m.group(0)
              tag = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#39FF14"', tag)
              tag = re.sub(r'stroke=["\'][^"\']+["\']', 'stroke="#00FF66"', tag)
              return tag

          svg = re.sub(r'<(polygon|path)[^>]+fill-opacity=[^>]+>', fix_radar_tag, svg, flags=re.IGNORECASE)

          # 3. 語言圓形圖：EVA 各機體官方代表色
          pie_colors = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_colors.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # 4. 核心色彩分流：黑底座 + 綠導軌 + 高柱螢光綠 + 矮柱夜戰暗紫
          protected = [c.upper() for c in pie_colors.values()] + ["#FF1E27", "#39FF14", "#00FF66", "#FFFFFF"]

          def process_rgb_tuple(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒純黑 (#000000)
              if l < 0.16 and s < 0.25:
                  return "#000000"

              # B. 跑道地盤與底座格線 -> 螢光綠發光導引軌道
              if 0.16 <= l < 0.40 and s < 0.28:
                  return "#15441E"  # 發光綠底板
              if 0.40 <= l < 0.55 and s < 0.28:
                  return "#39FF14"  # 銳利螢光綠格線

              # C. 標籤文字 (Commit, Issue, Repo 等) -> 使徒純白
              if s < 0.15 and l >= 0.55:
                  return "#FFFFFF"

              # D. 3D 柱狀圖顏色分配（原圖綠色調：色相 70° ~ 165°）
              if 0.18 <= h <= 0.48 and s > 0.15:
                  # 判定高柱頂面與受光面（原圖亮度高且綠色強）：暴走蓄光螢光綠
                  if g_val >= 160 and l >= 0.42:
                      if l >= 0.52:
                          return "#39FF14"  # 高柱頂部發光
                      else:
                          return "#28C70E"  # 高柱側面微光
                  # 判定其餘中低矮柱及背光面：Gaia EV-03 初號機夜戰裝甲紫
                  else:
                      purple_h = 0.768
                      adj_l = min(0.68, max(0.24, l * 0.88))
                      adj_s = min(1.0, max(0.75, s * 1.5))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return None

          def hex_replacer(m):
              c = m.group(0)
              if c.upper() in protected:
                  return c
              r = int(c[1:3], 16)
              g = int(c[3:5], 16)
              b = int(c[5:7], 16)
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else c

          def rgb_replacer(m):
              r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else m.group(0)

          # 全量無損替換色碼
          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_replacer, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_replacer, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully generated valid Eva-01 SVG.")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: fix SVG syntax and apply complete Eva-01 palette [skip ci]"
          git pull --rebase
          git push
