name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Evangelion Unit-01 Theme
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          def transform_color(match):
              h_str = match.group(0)
              r = int(h_str[1:3], 16) / 255.0
              g = int(h_str[3:5], 16) / 255.0
              b = int(h_str[5:7], 16) / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # 1. 背景與拘束架底座：極深黑紫
              if l < 0.15 and s < 0.25:
                  return "#0D0714"
              if 0.15 <= l < 0.35 and s < 0.25:
                  return "#1B0B2E"

              # 2. 綠色調元素（色相約 70° ~ 165°）：
              if 0.19 <= h <= 0.46 and s > 0.2:
                  # 最高峰頂部面與主要亮線 -> 保留點綴螢光綠（EVA 覺醒發光部位）
                  if l >= 0.58 or (g > 0.85 and r < 0.6 and b < 0.6):
                      return "#39FF14"
                  # 柱體主軀幹與側面光影 -> 初號機經典暗紫裝甲
                  else:
                      purple_h = 0.77  # 初號機紫 (約 277°)
                      adj_l = min(0.65, max(0.18, l * 0.95))
                      adj_s = min(1.0, max(0.55, s * 1.15))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return h_str

          # 全面替換 16 進位色碼
          converted_svg = re.sub(r'#[0-9a-fA-F]{6}', transform_color, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(converted_svg)

          print("Successfully converted to Eva-01 Purple Armor & Neon Green Accents.")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update Eva-01 3D graph [skip ci]"
          git pull --rebase
          git push
