name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Theme
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # ==========================================
          # 1. 語言圓形圖：EVA 全機體代表色矩陣 (優先替換)
          # ==========================================
          pie_colors = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_colors.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # ==========================================
          # 2. 右上角雷達圖：切換為暴走螢光綠
          # ==========================================
          def fix_radar_polygon(m):
              tag = m.group(0)
              if 'fill="none"' in tag or "fill='none'" in tag:
                  return tag
              tag = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#39FF14"', tag)
              tag = re.sub(r'stroke=["\'][^"\']+["\']', 'stroke="#00FF66"', tag)
              tag = re.sub(r'fill-opacity=["\'][^"\']+["\']', 'fill-opacity="0.38"', tag)
              return tag

          svg = re.sub(r'<(polygon|path)[^>]+fill-opacity[^>]+>', fix_radar_polygon, svg, flags=re.IGNORECASE)

          # ==========================================
          # 3. 核心 3D 柱體與底座轉換
          # ==========================================
          def process_3d_color(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒純黑
              if l < 0.16 and s < 0.25:
                  return "#000000"

              # B. 跑道地盤與底座格線 -> 螢光綠導引軌道
              if 0.16 <= l < 0.40 and s < 0.28:
                  return "#15441E"
              if 0.40 <= l < 0.55 and s < 0.28:
                  return "#39FF14"

              # C. 標籤文字 (Commit, Issue, Repo 等) -> 使徒純白
              if s < 0.15 and l >= 0.55:
                  return "#FFFFFF"

              # D. 3D 柱體分色處理
              if (g_val > r_val) and (g_val > b_val) and s > 0.15:
                  # 【最高峰柱 360 度全綠】門檻 g_val >= 100 覆蓋受光與背光面
                  if g_val >= 100:
                      if l >= 0.45:
                          return "#39FF14"  # 頂面：暴走蓄光螢光綠
                      elif l >= 0.30:
                          return "#28C70E"  # 受光側面：螢光綠中調
                      else:
                          return "#1A8A08"  # 背光側面：螢光綠暗面
                  # 【中低矮柱 360 度夜戰暗紫裝甲】
                  else:
                      purple_h = 0.768  # 官方初號機紫
                      adj_l = min(0.68, max(0.24, l * 0.90))
                      adj_s = min(1.0, max(0.75, s * 1.5))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return None

          def hex_replacer(m):
              c = m.group(0)
              protected = [
                  "#FF1E27", "#39FF14", "#00FF66", "#FFFFFF", "#000000",
                  "#15441E", "#F29600", "#19325C", "#D9001B", "#E85298", "#8A3FFC"
              ]
              if c.upper() in protected:
                  return c
              r, g, b = int(c[1:3], 16), int(c[3:5], 16), int(c[5:7], 16)
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else c

          def rgb_replacer(m):
              r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
              new_c = process_3d_color(r, g, b)
              return new_c if new_c else m.group(0)

          # 全量無損替換色彩
          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_replacer, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_replacer, svg)

          # ==========================================
          # 4. 提交數字：以錨點精準注入 NERV 警戒紅 (#FF1E27)
          # ==========================================
          # 尋找 contributions 所在位置
          pos = svg.lower().find("contributions")
          if pos != -1:
              # 取 contributions 前方 300 字元的區域
              start_pos = max(0, pos - 300)
              prefix = svg[start_pos:pos]

              # 在 prefix 中尋找最後出現的純數字標籤（相容 <tspan> 或 <text>）
              # 匹配形如：<tag ...>6270</tag> 或 >6270<
              def red_injector(match):
                  tag_open = match.group(1)
                  num = match.group(2)
                  tag_close = match.group(3)
                  # 若標籤已有 fill 屬性則替換，否則注入 fill 與粗體
                  if 'fill=' in tag_open:
                      tag_open = re.sub(r'fill=["\'][^"\']+["\']', 'fill="#FF1E27"', tag_open)
                  else:
                      tag_open = tag_open[:-1] + ' fill="#FF1E27" font-weight="bold">'
                  return f"{tag_open}{num}{tag_close}"

              # 尋找最近的一個包含數字的 XML 標籤並單獨改色
              pattern = r'(<(?:text|tspan)[^>]*>)(\s*\d+\s*)(</(?:text|tspan)>)'
              matches = list(re.finditer(pattern, prefix, flags=re.IGNORECASE))
              if matches:
                  last_m = matches[-1]
                  new_tag = red_injector(last_m)
                  prefix = prefix[:last_m.start()] + new_tag + prefix[last_m.end():]
                  svg = svg[:start_pos] + prefix + svg[pos:]
              else:
                  # 備用機制：若直接裸露在標籤內（如 >6270 contributions<）
                  svg = re.sub(
                      r'(>\s*)(\d+)(\s*contributions)',
                      r'\1<tspan fill="#FF1E27" font-weight="bold">\2</tspan> contributions',
                      svg,
                      count=1,
                      flags=re.IGNORECASE
                  )

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully rendered Eva-01 Masterpiece with NERV Red Number!")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: inject NERV red count and complete Eva-01 theme [skip ci]"
          git pull --rebase
          git push
