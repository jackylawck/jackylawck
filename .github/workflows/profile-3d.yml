name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply EVA-01 Masterpiece Palette (Red 6264 + Neon Green Grid Base)
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # 1. 提交數字「6264」改為 NERV 超機密警戒紅 (#FF1E27)
          svg = re.sub(
              r'(<text[^>]*>\s*)(\d+)(\s+contributions\s*</text>)',
              r'\g<1><tspan fill="#FF1E27" font-weight="bold">\g<2></tspan>\g<3>',
              svg
          )

          # 2. 圓形圖：EVA 全機體代表色矩陣
          pie_replacements = {
              "#f1e05a": "#F29600",  # 零號機 綾波麗橘黃 (EV-05)
              "#3572A5": "#19325C",  # Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # 二號機 明日香裝甲紅
              "#3178c6": "#E85298",  # 八號機 真希波特裝粉
              "#563d7c": "#8A3FFC",  # 初號機 高光亮紫
              "#89e051": "#39FF14",  # 初號機 螢光綠 (EV-04)
          }
          for old_c, new_c in pie_replacements.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          # 3. 核心著色處理：螢光綠底座軌道 + 飽和初號機暗紫柱 + 螢光綠雷達
          protected_colors = [c.upper() for c in pie_replacements.values()] + ["#FF1E27"]

          def process_rgb_tuple(r_val, g_val, b_val):
              r, g, b = r_val / 255.0, g_val / 255.0, b_val / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # A. 背景大底座 -> 使徒襲來純黑 (#000000)
              if l < 0.16 and s < 0.25:
                  return "#000000"

              # B. 跑道地盤與底座格線 (原本深灰 #2d333b / #444c56) -> 螢光綠發光導引軌道
              if 0.16 <= l < 0.40 and s < 0.28:
                  # 格線邊框與空日地台：轉為高清晰度 EVA 螢光綠底座
                  return "#15441E"  # 深層發光綠底板
              if 0.40 <= l < 0.55 and s < 0.28:
                  return "#39FF14"  # 銳利螢光綠格線，將紫色柱體清晰勾勒出來

              # C. 標籤文字 (Commit, Repo, Issue 等) -> 使徒襲來純白
              if s < 0.15 and l >= 0.55:
                  return "#FFFFFF"

              # D. 原圖綠色調處理（包含柱體與右上角雷達圖）
              if 0.18 <= h <= 0.48 and s > 0.15:
                  # 右上角雷達圖與高亮指標 -> Gaia EV-04 / EV-02 螢光綠系
                  if l >= 0.70 or (g > 0.88 and r < 0.4):
                      return "#39FF14"  # 暴走螢光綠 (EV-04)
                  # 3D 柱體本體 -> Gaia EV-01 / EV-03 初號機飽和夜戰裝甲紫
                  else:
                      purple_h = 0.768  # 官方初號機紫
                      # 提高對比度與飽和度，避免與黑底黏在一起
                      adj_l = min(0.68, max(0.24, l * 0.88))
                      adj_s = min(1.0, max(0.75, s * 1.5))
                      nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                      return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return None

          def hex_replacer(match):
              hex_code = match.group(0)
              if hex_code.upper() in protected_colors:
                  return hex_code
              r = int(hex_code[1:3], 16)
              g = int(hex_code[3:5], 16)
              b = int(hex_code[5:7], 16)
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else hex_code

          def rgb_replacer(match):
              r = int(match.group(1))
              g = int(match.group(2))
              b = int(match.group(3))
              new_c = process_rgb_tuple(r, g, b)
              return new_c if new_c else match.group(0)

          # 執行替換
          svg = re.sub(r'#[0-9a-fA-F]{6}', hex_replacer, svg)
          svg = re.sub(r'rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', rgb_replacer, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Successfully injected Neon Genesis Evangelion Masterpiece Theme!")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: apply Evangelion Red alert & neon green base palette [skip ci]"
          git pull --rebase
          git push
