name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 (香港時間 02:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Harden Runner (Audit Mode)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply Official Gaia/Mr.Hobby Eva-01 Palette
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          # 圓形圖色票替換表 (EVA 機體代表色)
          pie_replacements = {
              "#f1e05a": "#F29600",  # JS 黃 -> 零號機橘黃 (EV-05)
              "#3572A5": "#19325C",  # Python 藍 -> Mark.06 渚薰深藍
              "#e34c26": "#D9001B",  # HTML 紅 -> 二號機明日香烈焰紅
              "#3178c6": "#E85298",  # TS 藍 -> 八號機真希波特裝粉
              "#563d7c": "#7B42BC",  # CSS 紫 -> 初號機高光亮紫
              "#89e051": "#39FF14",  # 綠色標籤 -> 初號機螢光綠 (EV-04)
          }

          for old_c, new_c in pie_replacements.items():
              svg = re.sub(re.escape(old_c), new_c, svg, flags=re.IGNORECASE)

          def apply_eva_colors(match):
              h_str = match.group(0)
              
              # 若剛好是替換後的 EVA 機體色，保持不變
              if h_str.upper() in [c.upper() for c in pie_replacements.values()]:
                  return h_str

              r = int(h_str[1:3], 16) / 255.0
              g = int(h_str[3:5], 16) / 255.0
              b = int(h_str[5:7], 16) / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # 1. 拘束架底色與背景（深邃黑紫）
              if l < 0.15 and s < 0.25:
                  return "#0E0817"
              if 0.15 <= l < 0.35 and s < 0.25:
                  return "#1A0E2A"

              # 2. 3D 柱體與網格處理（色相 70° ~ 165° 的綠色）
              if 0.19 <= h <= 0.46 and s > 0.2:
                  # 極少數：僅最高活躍度頂面保留 EV-04 暴走螢光綠
                  if l >= 0.78 or (g > 0.92 and r < 0.4):
                      return "#39FF14"
                  
                  # 80% 以上主體：全數轉為 Gaia EV-03 初號機夜戰暗紫裝甲
                  purple_h = 0.765  # 官方初號機紫
                  adj_l = min(0.55, max(0.18, l * 0.75))
                  adj_s = min(1.0, max(0.65, s * 1.35))
                  nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                  return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return h_str

          converted_svg = re.sub(r'#[0-9a-fA-F]{6}', apply_eva_colors, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(converted_svg)

          print("Successfully rendered Eva Series Multi-Color Palette.")
          EOF

      - name: Commit & Push (Signed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update Eva series colors 3D graph [skip ci]"
          git pull --rebase
          git push
