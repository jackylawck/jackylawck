      - name: Apply Official Gaia/Mr.Hobby Eva-01 Palette
        run: |
          python3 - << 'EOF'
          import colorsys
          import re

          src_path = "profile-3d-contrib/profile-night-green.svg"
          dest_path = "profile-3d-contrib/profile-eva-01.svg"

          with open(src_path, "r", encoding="utf-8") as f:
              svg = f.read()

          def apply_eva_colors(match):
              h_str = match.group(0)
              r = int(h_str[1:3], 16) / 255.0
              g = int(h_str[3:5], 16) / 255.0
              b = int(h_str[5:7], 16) / 255.0
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              # 1. 拘束架底色與背景（深邃黑紫）
              if l < 0.15 and s < 0.25:
                  return "#0E0817"
              if 0.15 <= l < 0.35 and s < 0.25:
                  return "#1A0E2A"

              # 2. 綠色調元素處理（色相 70° ~ 165°）
              if 0.19 <= h <= 0.46 and s > 0.2:
                  # 極少數：僅最高活躍度頂面（極高亮度與高飽和）保留 EV-04 暴走螢光綠
                  if l >= 0.78 or (g > 0.92 and r < 0.4):
                      return "#39FF14"
                  
                  # 絕大多數（80%以上）：全數轉為 Gaia EV-03 初號機夜戰暗紫裝甲
                  # 根據原本的光影深度（l）對應深紫到亮紫
                  purple_h = 0.76  # 官方初號機紫
                  adj_l = min(0.55, max(0.18, l * 0.75))
                  adj_s = min(1.0, max(0.65, s * 1.35))
                  nr, ng, nb = colorsys.hls_to_rgb(purple_h, adj_l, adj_s)
                  return f"#{int(round(nr*255)):02X}{int(round(ng*255)):02X}{int(round(nb*255)):02X}"

              return h_str

          converted_svg = re.sub(r'#[0-9a-fA-F]{6}', apply_eva_colors, svg)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write(converted_svg)

          print("Successfully rendered Eva-01 Official Gaia/Mr.Hobby Palette.")
          EOF
