<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <title>Redirecting to Jacky Law (羅子淇)...</title>
    
    <!-- 1. 0秒無縫自動跳轉 (給瀏覽器訪客) -->
    <meta http-equiv="refresh" content="0; url=https://jackylawck.github.io/">
    
    <!-- 2. 最核心 SEO 權重轉移信號：權威鏈接指向新根網址 (告訴 Google 權重全歸新站) -->
    <link rel="canonical" href="https://jackylawck.github.io/">
    
    <!-- 3. 禁止搜尋引擎繼續索引舊頁面，促使 Google 盡快用新根網址替換搜尋結果 -->
    <meta name="robots" content="noindex, follow">
    
    <!-- 4. 保留原有的 Google 驗證，確保 Search Console 產權驗證不中斷 -->
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />
</head>
<body style="font-family: -apple-system, sans-serif; text-align: center; padding: 50px 20px; color: #334155;">

</body>
</html>
